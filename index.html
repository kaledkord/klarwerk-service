    <!--
      Loader beim ersten Besuch: Logo mit Werkzeugen (Entwurf A aus dem Logo-Entwurf), zerlegt in Dach,
      Säulen, Werkzeuge und Schrift. Steht außerhalb von #root, damit React ihn nicht anfasst.
      Das Skript setzt die Klasse vor dem ersten Bild, die CSS-Animationen brauchen kein JavaScript-Bundle.
      Nur einmal je Sitzung, nie bei „Bewegung reduzieren“. Nach 2 s ist er weg.
    -->
    <script>
      (function () {
        try {
          if (sessionStorage.getItem('klw-intro') || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
          sessionStorage.setItem('klw-intro', '1');
          var html = document.documentElement;
          html.classList.add('klw-intro');
          setTimeout(function () {
            var loader = document.getElementById('klw-loader');
            if (loader) loader.remove();
          }, 2000);
          // Die Startseite wartet mit ihrer Animation auf den Vorhang; danach wieder ohne Verzögerung.
          setTimeout(function () { html.classList.remove('klw-intro'); }, 4000);
        } catch (e) { /* ohne sessionStorage kein Loader */ }
      })();
    </script>
    <style>
      #klw-loader { display: none; }
      html.klw-intro #klw-loader {
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 26px; background: #0f1826;
        animation: klw-vorhang .55s cubic-bezier(.65, 0, .35, 1) 1.3s both;
      }
      #klw-loader .klw-loader-logo { width: min(260px, 60vw); height: auto; overflow: visible; }
      #klw-loader .klw-fortschritt { width: min(200px, 44vw); height: 3px; border-radius: 3px; overflow: hidden; background: rgba(255, 255, 255, .08); }
      #klw-loader .klw-fortschritt i { display: block; height: 100%; background: linear-gradient(90deg, #35a1da, #2aa391, #22a750); transform-origin: left; animation: klw-wachsen 1.2s cubic-bezier(.65, 0, .35, 1) both; }
      #klw-loader .klw-streifen { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; display: grid; grid-template-columns: repeat(4, 1fr); }
      #klw-loader .klw-streifen i:nth-child(1) { background: #35a1da; }
      #klw-loader .klw-streifen i:nth-child(2) { background: #f5891f; }
      #klw-loader .klw-streifen i:nth-child(3) { background: #f0552b; }
      #klw-loader .klw-streifen i:nth-child(4) { background: #21a841; }
      #klw-loader .lg-p { transform-box: fill-box; transform-origin: 50% 100%; animation: klw-saeule .5s cubic-bezier(.22, 1, .36, 1) both; animation-delay: calc(.05s + var(--i) * 80ms); }
      #klw-loader .lg-roof { stroke-dasharray: 1 2; animation: klw-zeichnen .55s cubic-bezier(.65, 0, .35, 1) .3s both; }
      #klw-loader .lg-symbol { transform-box: fill-box; transform-origin: 50% 60%; animation: klw-symbol .4s cubic-bezier(.34, 1.56, .64, 1) both; animation-delay: calc(.38s + var(--i) * 80ms); }
      #klw-loader .lg-wort1 { animation: klw-wort .45s cubic-bezier(.22, 1, .36, 1) .7s both; }
      #klw-loader .lg-wort2 { animation: klw-wort .45s cubic-bezier(.22, 1, .36, 1) .8s both; }
      @keyframes klw-symbol { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
      @keyframes klw-vorhang { from { transform: translateY(0); } to { transform: translateY(-101%); } }
      @keyframes klw-wachsen { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes klw-saeule { from { transform: scaleY(0); opacity: 0; } 40% { opacity: 1; } to { transform: scaleY(1); opacity: 1; } }
      @keyframes klw-zeichnen { from { stroke-dashoffset: 1.05; } to { stroke-dashoffset: 0; } }
      @keyframes klw-wort { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    </style>
