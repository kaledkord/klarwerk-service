<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1f3c" />
    <meta name="author" content="KlarWerk Service" />

    <!-- Favicons: quadratische PNGs in Vielfachen von 48 px (Google-Vorgabe), klein statt 813 KB -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!--
      Seitenspezifische Tags (title, description, canonical, robots, Open Graph, Twitter, JSON-LD)
      kommen ausschließlich aus der SEO-Komponente (react-helmet-async). Beim Build rendert
      scripts/prerender.mjs jede Route vor und ersetzt den Platzhalter unten. Statische Duplikate
      hier würden Google widersprüchliche Canonicals/Descriptions liefern – deshalb keine.
    -->
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
