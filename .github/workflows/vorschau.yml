name: Vorschau (temporaer)
on:
  push:
    branches: [mira/bueroreinigung-kiel]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: dist auf Vorschau-Branch
        run: |
          cd dist
          git init -q
          git config user.name vorschau
          git config user.email vorschau@users.noreply.github.com
          git add -A
          git commit -qm vorschau
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/vorschau/praxisreinigung-kiel
